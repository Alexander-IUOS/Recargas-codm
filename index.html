<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro Oficial de Recargas - COD Mobile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --gold: #ffb400;
      --gold-glow: rgba(255, 180, 0, 0.4);
      --dark-bg: #0d0e12;
      --card-bg: #151821;
      --card-border: #242938;
      --text-main: #e1e7ed;
      --text-muted: #8c9ba5;
      --green-accent: #00e676;
      --red-alert: #ff5252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--dark-bg);
      color: var(--text-main);
      padding-bottom: 40px;
    }

    /* Header */
    header {
      background-color: #08090c;
      border-bottom: 2px solid var(--gold);
      padding: 15px 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    }

    .header-content {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo i {
      font-size: 2rem;
      color: var(--gold);
      position: relative;
    }

    .crosshair-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 4px;
      background: red;
      border-radius: 50%;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .brand {
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: 2px;
      color: #fff;
    }

    .subbrand {
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      color: var(--gold);
    }

    .badge-secure {
      font-size: 0.85rem;
      color: var(--green-accent);
      background: rgba(0, 230, 118, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 230, 118, 0.3);
    }

    /* Banner */
    .banner {
      position: relative;
      background: linear-gradient(135deg, #1c1d24 0%, #0a0b0e 100%);
      border-bottom: 1px solid var(--card-border);
      padding: 30px 20px;
      text-align: center;
      overflow: hidden;
    }

    .banner-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
      margin: 0 auto;
    }

    .banner-tag {
      display: inline-block;
      background: var(--gold);
      color: #000;
      font-weight: 900;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .banner h2 {
      font-size: 1.5rem;
      letter-spacing: 1px;
      color: #fff;
      margin-bottom: 5px;
    }

    .banner p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Layout */
    .container {
      max-width: 900px;
      margin: 25px auto 0;
      padding: 0 15px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .step-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
    }

    .step-num {
      background: var(--gold);
      color: #000;
      font-weight: 900;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .step-header h3 {
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .step-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Paso 1: Input */
    .input-group {
      display: flex;
      gap: 10px;
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .input-group input {
      flex: 1;
      background: #090b0e;
      border: 1px solid #2b3245;
      border-radius: 6px;
      padding: 12px 12px 12px 40px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }

    .input-group input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 8px var(--gold-glow);
    }

    .input-group button {
      background: var(--gold);
      color: #000;
      font-weight: 800;
      border: none;
      border-radius: 6px;
      padding: 0 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .input-group button:hover {
      background: #e6a200;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 0.88rem;
    }

    /* Paso 2: Tabs y Cards de CP */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tab-btn {
      background: #0d0f14;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    .grid-cp {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 15px;
    }

    .cp-card {
      background: #0d0f14;
      border: 2px solid var(--card-border);
      border-radius: 8px;
      padding: 18px 12px;
      text-align: center;
      position: relative;
      cursor: pointer;
      transition: 0.25s;
    }

    .cp-card:hover {
      border-color: var(--gold);
      transform: translateY(-3px);
    }

    .cp-card.selected {
      border-color: var(--gold);
      background: #1e1b12;
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .badge-pop, .badge-pass {
      position: absolute;
      top: -10px;
      right: 10px;
      background: var(--gold);
      color: #000;
      font-weight: 900;
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .badge-pass {
      background: #00e676;
    }

    .cp-icon {
      font-size: 2.2rem;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .cp-amount {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .cp-bonus-text {
      font-size: 0.72rem;
      color: var(--green-accent);
      margin-bottom: 12px;
    }

    .cp-price {
      background: rgba(255, 180, 0, 0.15);
      color: var(--gold);
      font-weight: 800;
      padding: 6px 0;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    /* Paso 3: Métodos de Pago */
    .payment-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .pay-option {
      background: #0d0f14;
      border: 2px solid var(--card-border);
      border-radius: 8px;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }

    .pay-option i {
      font-size: 1.8rem;
      color: var(--text-muted);
    }

    .pay-option span {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .pay-option:hover {
      border-color: var(--gold);
    }

    .pay-option.selected {
      border-color: var(--gold);
      background: #1e1b12;
    }

    .pay-option.selected i {
      color: var(--gold);
    }

    /* Paso 4: Resumen */
    .summary-card h3 {
      letter-spacing: 1px;
      color: var(--gold);
      margin-bottom: 15px;
    }

    .summary-details {
      background: #090b0e;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .summary-row span {
      color: var(--text-muted);
    }

    .divider {
      border: 0;
      border-top: 1px dashed var(--card-border);
      margin: 12px 0;
    }

    .total-row {
      font-size: 1.15rem;
    }

    .total-price {
      color: var(--green-accent);
      font-size: 1.3rem;
    }

    #payBtn {
      width: 100%;
      background: var(--gold);
      color: #000;
      font-size: 1.1rem;
      font-weight: 900;
      border: none;
      padding: 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 1px;
    }

    #payBtn:hover:not(:disabled) {
      background: #e6a200;
      box-shadow: 0 0 15px var(--gold-glow);
    }

    #payBtn:disabled {
      background: #2b303d;
      color: #5c6475;
      cursor: not-allowed;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 2px solid var(--gold);
      border-radius: 12px;
      max-width: 450px;
      width: 100%;
      padding: 25px;
      text-align: center;
      box-shadow: 0 0 25px var(--gold-glow);
    }

    .modal-icon {
      font-size: 3rem;
      color: var(--green-accent);
      margin-bottom: 10px;
    }

    .modal h2 {
      font-size: 1.2rem;
      margin-bottom: 5px;
      color: var(--gold);
    }

    .modal-sub {
      font-size: 0.95rem;
      color: var(--text-main);
      font-weight: 600;
      margin-bottom: 20px;
    }

    .modal-info {
      background: #080a0d;
      border-radius: 8px;
      padding: 15px;
      text-align: left;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }

    .code-box {
      background: #1d2230;
      color: var(--gold);
      padding: 3px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: bold;
    }

    .instruction-text {
      font-size: 0.85rem;
      color: var(--green-accent);
      font-weight: 700;
      margin-bottom: 20px;
    }

    #closeModalBtn {
      width: 100%;
      background: var(--gold);
      color: #000;
      font-weight: 800;
      border: none;
      padding: 12px;
